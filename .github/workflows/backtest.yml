name: Run Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ccxt pandas numpy

      - name: Cache candles
        uses: actions/cache@v4
        with:
          path: cache
          key: candles-${{ github.run_id }}
          restore-keys: candles-

      - name: Run ETH Momentum Breakout
        run: python3 backtestgpt.py

      - name: Evaluate ETH Momentum Breakout
        run: python3 evaluate.py --eth

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-momentum-breakout-results
          path: |
            eth_momentum_summary.json
            eth_momentum_trades.csv
            eth_momentum_evaluation.md
          if-no-files-found: warn
