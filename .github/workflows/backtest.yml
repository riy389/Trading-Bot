name: Run Backtest

on:
  workflow_dispatch:  # klik tombol "Run workflow" manual di tab Actions

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ccxt pandas numpy

      - name: Cache candles
        uses: actions/cache@v4
        with:
          path: cache
          key: candles-${{ github.run_id }}
          restore-keys: candles-

      - name: Run backtest
        run: python3 backtest.py

      - name: Evaluate results
        run: python3 evaluate.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            results_summary.csv
            results.json
            capital_sim.csv
          if-no-files-found: warn
