name: Run Entry Tree

on:
  workflow_dispatch:

jobs:
  entrytree:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ccxt pandas numpy scikit-learn

      - name: Cache candles
        uses: actions/cache@v4
        with:
          path: cache
          key: candles-${{ github.run_id }}
          restore-keys: candles-

      - name: Run entry tree
        run: python3 entrytree.py
