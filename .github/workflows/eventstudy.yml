name: Run Event Study

on:
  workflow_dispatch:

jobs:
  eventstudy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ccxt pandas numpy

      - name: Cache candles
        uses: actions/cache@v4
        with:
          path: cache
          key: candles-${{ github.run_id }}
          restore-keys: candles-

      - name: Run event study
        run: python3 eventstudy.py
