name: Run MACD_DH

on:
  workflow_dispatch:  # klik tombol "Run workflow" manual di tab Actions
    inputs:
      check_only:
        description: "Cek sinyal saja (tanpa backtest)"
        type: boolean
        default: false

jobs:
  macddh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ccxt pandas numpy

      - name: Cache candles
        uses: actions/cache@v4
        with:
          path: cache
          key: candles-${{ github.run_id }}
          restore-keys: candles-

      - name: Run MACD_DH
        run: python3 macddh.py
        env:
          CHECK_ONLY: ${{ inputs.check_only && '1' || '0' }}

      - name: Upload results
        if: ${{ hashFiles('trades_macddh.csv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: macddh-results
          path: trades_macddh.csv
          if-no-files-found: warn
