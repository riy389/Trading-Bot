name: Paper Trade UT 4h

on:
  schedule:
    - cron: "5 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: papertrade

jobs:
  papertrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ccxt pandas numpy scikit-learn

      - name: Run paper trade
        run: python3 papertrade.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

      - name: Simpan state dan log
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add paper
          git diff --cached --quiet || (git commit -m "paper: update" && git push)
